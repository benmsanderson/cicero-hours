name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  board:
    # The allocation board is browser code, so it is exercised in a DOM rather
    # than by pytest. Same harness drives both the Python dashboard and the
    # browser build; the runtime is one file (spec/board.js) and the same
    # assertions cover both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e "."
      - run: npm install
      - run: npm run test:board
      - run: npm run test:board:web

  cross:
    # The browser build's loader and model run against the synthetic export
    # and are asserted key by key against spec/expected.json, so a Python
    # change that moves a number and a JS change that fails to follow both
    # break this step. It is the single thing standing between two colleagues
    # opening the two builds and bringing contradictory numbers to a meeting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e "."
      - run: npm install
      - run: npm run test:cross

  shell:
    # Builds the browser bundle and drives it in jsdom: drops the synthetic
    # export into the page and checks the KPIs and tab machinery. Catches
    # the class of bugs that only show up once the wiring meets the DOM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e "."
      - run: npm install
      - run: npm run test:shell
